<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Mobile-first viewport configuration for iOS -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <!-- iOS PWA meta tags for fullscreen app experience -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FightCamp Wizard" />
  <!-- Prevent iOS Safari from auto-formatting phone numbers -->
  <meta name="format-detection" content="telephone=no" />
  <title>FightCamp Wizard - Safe Combat Sports Weight Management</title>
  <meta name="description"
    content="AI-assisted weight cutting for combat sports athletes. Science-based, safe, and effective weight management with personalized guidance." />
  <meta name="author" content="FightCamp Wizard" />

  <!-- Preconnect to Convex for faster WebSocket handshake and TLS negotiation -->
  <link rel="preconnect" href="https://fast-koala-318.eu-west-1.convex.cloud" crossorigin />

  <meta property="og:title" content="FightCamp Wizard" />
  <meta property="og:description" content="Safe AI-assisted weight cutting for combat sports" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@lovable_dev" />
  <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

  <!-- Design System v1 is dark-only. Force `.dark` on <html> at parse time so
       descendant `.dark X` selectors and shadcn dark tokens always apply, and
       to prevent any flash of light styling on first paint. Also writes
       `theme=dark` to localStorage so the legacy ThemeToggle (now a no-op)
       and any other code reading the value sees a consistent state. -->
  <script>
    (function () {
      try {
        document.documentElement.classList.add("dark");
        localStorage.setItem("theme", "dark");
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
